# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
# Usaremos el puerto 8090 para que no choque en tu VPS más adelante
server.port=8090

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ===============================
# createDatabaseIfNotExist=true creará la BD 'act4_db' automáticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/act4_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===============================
# update: actualiza las tablas automáticamente según tus entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACIÓN DE JWT
# ===============================
# Firma secreta (256-bit Hex) - En producción esto va en variables de entorno
jwt.secret=413F4428472B4B6250655368566D5970337336763979244226452948404D6351
# Tiempo de expiración del token en milisegundos (86400000 = 1 día)
jwt.expiration=86400000